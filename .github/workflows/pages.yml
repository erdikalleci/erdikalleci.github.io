name: Deploy static site
on:
push:
branches: [master]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Prepare artifact
run: |
mkdir -p dist
cp index.html dist/index.html
cp logo-16-256.ico dist/logo-16-256.ico || true
# Özel alan adı kullanıyorsan aç:
# echo erdikalleci.com > dist/CNAME
- name: Upload artifact
uses: actions/upload-pages-artifact@v3
with:
path: dist

deploy:
runs-on: ubuntu-latest
needs: build
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- id: deployment
uses: actions/deploy-pages@v4

Notlar

Repo Settings > Pages bölümünde “Source: GitHub Actions” seçili olmalı.
Başka asset’ler (görsel, css, js) eklerse dist içine kopyala.
Alternatif (JamesIves ile gh-pages dalına)

Mevcut aksiyonuna benzer kullanım; .NET adımlarını silip şu şekilde sadeleştirebilirsin:
name: Deploy to gh-pages
on:
push:
branches: [master]
workflow_dispatch:

jobs:
deploy:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Build static folder
run: |
mkdir -p dist
cp index.html dist/index.html
cp logo-16-256.ico dist/logo-16-256.ico || true
# echo erdikalleci.com > dist/CNAME
- name: Deploy
uses: JamesIves/github-pages-deploy-action@v4
with:
token: ${{ secrets.GITHUB_TOKEN }}
branch: gh-pages
folder: dist
clean: true
